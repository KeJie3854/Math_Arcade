name: math_app
description: "Math app for kids made by Nga Ke Jie 2204431"
publish_to: 'none' # Prevents accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  confetti: ^0.7.0
  flutter_launcher_icons: ^0.14.3
  shared_preferences: ^2.2.2  # Persistent leaderboard storage
  audioplayers: ^5.2.1       # Sound effects
  google_fonts: ^6.1.0       # Added for custom Fredoka font in leaderboard

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png          # App icon
    - assets/sounds/confetti.mp3  # Winning sound
    - assets/sounds/lose.mp3      # Losing sound

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"